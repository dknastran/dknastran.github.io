<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<title>DK Nastran - NASA NASTRAN User's Manual</title>

<style>

    /* =========================================================
       DK Nastran Color Palette
       ========================================================= */

    :root {
        /* Base */
        --text:     #dddddd;
        --muted:    #9a9a9a;

        /* Blender-inspired UI colors */
        --blue:     #4c9fff;
        --cyan:     #00b8c8;
        --green:    #5bbd3e;
        --yellow:   #c8c832;
        --orange:   #ff8a00;
        --red:      #e64545;
        --purple:   #a66dd4;
    }

    /* =========================================================
       Page
       ========================================================= */
    body {
        margin: 0;

        /* Light */
        /* background: #ffffff; */
        /* color: #111111; */

        /* Dark - soft */
        background: #202020;
        color: #dddddd;

        /* Dark - medium */
        /* background: #1e1e1e; */
        /* color: #dcdcdc; */

        /* Dark - deep */
        /* background: #181818; */
        /* color: #d8d8d8; */

        /* Blender-style */
        /* background: #303030; */
        /* color: #dddddd; */
    }

    /* =========================================================
       DK Nastran Title
       ========================================================= */
    .dk-title {
        padding: 24px 24px 6px 24px;

        font-family:
            system-ui,
            -apple-system,
            "Segoe UI",
            sans-serif;

        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.5px;

        color: var(--text);
    }

    .dk-title .dk {
        color: var(--orange);
    }

    /* =========================================================
       Page Subtitle
       ========================================================= */

    .page-title {
        padding: 0 24px 20px 24px;

        font-family:
            system-ui,
            -apple-system,
            "Segoe UI",
            sans-serif;

        font-size: 16px;
        font-weight: 400;

        color: var(--muted);
    }

    /* =========================================================
       Color Test
       Remove or comment out later if unnecessary
       ========================================================= */

    .color-test {
        padding: 24px;

        font-family:
            "Courier New",
            "Liberation Mono",
            "DejaVu Sans Mono",
            monospace;

        font-size: 14px;
        line-height: 1.6;

        border-top: 1px solid #383838;
        border-bottom: 1px solid #383838;
    }

    /* =========================================================
       NASA NASTRAN Original Manual
       ========================================================= */

    .manual {
        margin: 0;
        padding: 24px;

        font-family:
            "Courier New",
            "Liberation Mono",
            "DejaVu Sans Mono",
            monospace;

        font-size: 14px;
        line-height: 1;

        color: var(--text);

        white-space: pre;
        overflow-x: auto;
        tab-size: 8;

        font-variant-ligatures: none;
    }

</style>

</head>

<body>
<!-- =========================================================
     DK Nastran Header
     ========================================================= -->

<div class="dk-title">
    <span class="dk">DK</span> Nastran
</div>

<div class="page-title">
    NASA NASTRAN User's Manual
</div>

<!-- =========================================================
     Color Test
     ========================================================= -->

<div class="color-test">

    <div style="color: var(--text);">
        Normal text
    </div>

    <div style="color: var(--muted);">
        Muted text
    </div>

    <div style="color: var(--blue);">
        Section / Title
    </div>

    <div style="color: var(--cyan);">
        CBAR / CIHEX2 / GRID
    </div>

    <div style="color: var(--green);">
        Valid / Success
    </div>

    <div style="color: var(--yellow);">
        Link / Reference
    </div>

    <div style="color: var(--orange);">
        Selected / Active
    </div>

    <div style="color: var(--red);">
        Warning / Error
    </div>

    <div style="color: var(--purple);">
        Additional Highlight
    </div>

</div>

<!-- =========================================================
     NASA NASTRAN Original Manual
     ========================================================= -->
<pre class="manual">

DK Nastran

</pre>

</body>

</html>
